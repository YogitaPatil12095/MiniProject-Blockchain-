services:
  - type: web
    name: intellihealth-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGIN
        sync: false
      - key: ADMIN_ADDRESS
        sync: false
