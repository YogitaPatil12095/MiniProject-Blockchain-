<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Outer Shield -->
  <path d="M50 8 C68 8, 86 16, 86 36 C86 62, 50 88, 50 88 C50 88, 14 62, 14 36 C14 16, 32 8, 50 8 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)"/>

  <!-- Inner Medical Cross & Blockchain Nodes -->
  <path d="M44 32 H56 V44 H68 V56 H56 V68 H44 V56 H32 V44 H44 Z" fill="#FFFFFF" opacity="0.95"/>
  
  <!-- Pulse Line -->
  <path d="M28 50 L38 50 L42 40 L48 60 L54 44 L58 52 L62 50 L72 50" 
        stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Accent Nodes -->
  <circle cx="50" cy="18" r="3" fill="#6366F1" />
  <circle cx="80" cy="36" r="3" fill="#6366F1" />
  <circle cx="20" cy="36" r="3" fill="#6366F1" />
</svg>
